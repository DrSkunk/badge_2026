backend:
  name: git-gateway
  branch: main

# Netlify Identity + Git Gateway handles hosted login and repo access.
publish_mode: editorial_workflow

site_url: https://fri3d2026.netlify.app/badge_2026/
display_url: https://fri3d2026.netlify.app/badge_2026/
logo_url: /badge_2026/assets/logo_black.svg

i18n:
  structure: multiple_files
  locales: [nl, en]
  default_locale: nl

media_folder: docs/assets/uploads
public_folder: /badge_2026/assets/uploads

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: docs
    label: Documentation
    label_singular: Page
    folder: docs
    create: true
    extension: md
    i18n: true
    summary: "{{title}}"
    slug: "{{slug}}"
    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: body
        label: Content
        widget: markdown
        i18n: true

  # Left sidebar menu of the website. Edits nav.yml in the repo root;
  # MkDocs builds the navigation from that file. Drag items to reorder.
  - name: navigation
    label: Menu
    files:
      - name: nav
        label: Website menu (left sidebar)
        file: nav.yml
        fields:
          - name: menu
            label: Menu items
            label_singular: menu item
            widget: list
            summary: "{{fields.title_nl}}"
            types:
              - name: page
                label: Page
                widget: object
                summary: "{{fields.page}}"
                fields:
                  - name: page
                    label: Page
                    widget: relation
                    collection: docs
                    value_field: "{{slug}}"
                    search_fields: [title]
                    display_fields: [title]
                  - name: title_nl
                    label: Menutitel (NL) — leeg laten voor de paginatitel
                    widget: string
                    required: false
                  - name: title_en
                    label: Menu title (EN) — leave empty for the page title
                    widget: string
                    required: false
              - name: section
                label: Section (group of pages)
                widget: object
                summary: "{{fields.title_nl}}"
                fields:
                  - name: title_nl
                    label: Sectietitel (NL)
                    widget: string
                  - name: title_en
                    label: Section title (EN)
                    widget: string
                    required: false
                  - name: pages
                    label: Pages in this section
                    label_singular: page
                    widget: list
                    summary: "{{fields.page}}"
                    fields:
                      - name: page
                        label: Page
                        widget: relation
                        collection: docs
                        value_field: "{{slug}}"
                        search_fields: [title]
                        display_fields: [title]
                      - name: title_nl
                        label: Menutitel (NL) — leeg laten voor de paginatitel
                        widget: string
                        required: false
                      - name: title_en
                        label: Menu title (EN) — leave empty for the page title
                        widget: string
                        required: false

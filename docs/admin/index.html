<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <title>Fri3d 2026 Docs CMS</title>

    <script>
      // The CMS only works on Netlify through Identity + Git Gateway.
      // Redirect visitors from the GitHub Pages deployment.
      if (window.location.hostname === "fri3dcamp.github.io") {
        window.location.replace(
          "https://fri3d2026.netlify.app/badge_2026/admin/"
        );
      }
    </script>
  </head>

  <body>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script src="https://unpkg.com/decap-cms@3.15.1/dist/decap-cms.js"></script>

    <script>
      const DocsPreview = createClass({
        render() {
          return h(
            "main",
            { className: "md-main" },
            h(
              "div",
              { className: "md-content" },
              h(
                "article",
                {
                  className:
                    "md-content__inner md-typeset",
                },
                this.props.widgetFor("body")
              )
            )
          );
        },
      });

      CMS.registerPreviewTemplate("docs", DocsPreview);

      CMS.registerPreviewStyle(
        "/badge_2026/assets/stylesheets/cms-preview.css"
      );
    </script>

    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", function (user) {
          if (!user) {
            window.netlifyIdentity.on(
              "login",
              function () {
                window.location.href =
                  "/badge_2026/admin/";
              }
            );
          }
        });
      }
    </script>
  </body>
</html>

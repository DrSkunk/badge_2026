site_name: Fri3d 2026
site_url: https://fri3dcamp.github.io/badge_2026/
docs_dir: docs

theme:
  name: material
  logo: assets/logo_white.svg
  favicon: assets/favicon-96x96.png
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - search.suggest
    - search.highlight
    - search.share
    - navigation.tracking
    - navigation.indexes
    - navigation.sections
    - content.code.copy
    - content.code.select
    - content.code.annotate

# The left sidebar menu is defined in nav.yml (repo root) and loaded by
# the mkdocs_hooks/nav_from_yaml.py hook. Edit nav.yml directly, or use
# the "Menu" collection in the CMS.

markdown_extensions:
  - toc
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition

hooks:
  - mkdocs_hooks/i18n_theme_compat.py
  - mkdocs_hooks/nav_from_yaml.py

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          # English menu titles are injected from nav.yml by
          # mkdocs_hooks/nav_from_yaml.py.
        - locale: nl
          default: true
          name: Nederlands

extra_css:
  - assets/stylesheets/home-cards.css
  
  - assets/stylesheets/fri3d-diagrams.css

extra_javascript:
  - assets/javascripts/fri3d-diagrams.js

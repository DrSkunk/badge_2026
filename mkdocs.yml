site_name: Fri3d 2026
site_url: https://fri3dcamp.github.io/badge_2026/
docs_dir: docs

theme:
  name: material
  logo: assets/logo_white.svg
  favicon: assets/favicon-96x96.png
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - search.suggest
    - search.highlight
    - search.share
    - navigation.tracking
    - navigation.indexes
    - navigation.sections
    - content.code.copy
    - content.code.select
    - content.code.annotate

# ------------------------------------------------------------------
# Left sidebar menu (order matters, top to bottom).
#
# Adding a page? Add one line below with the Dutch title and the base
# file name WITHOUT the language suffix: use "mijn-pagina.md", not
# "mijn-pagina.nl.md" — the i18n plugin picks the right language file.
# Then add the English title for it under "nav_translations" in the
# i18n plugin section further down.
# ------------------------------------------------------------------
nav:
  - Start: index.md
  - Hardware:
      - Badge: badge.md
      - Communicator: communicator.md
      - DJ Add-on: dj.md
      - LoRa kit: lora.md
      - ToF Sensor: tof.md
      - SAO Mirror: mirror.md
  - Software:
      - MCP-server: mcp.md
      - Programmeren: programming.md
  - Bijdragen aan docs: contribute.md

markdown_extensions:
  - toc
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition

hooks:
  - mkdocs_hooks/i18n_theme_compat.py

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          # English titles for the Dutch nav labels above.
          # New page? Add a "Dutch title: English title" line here.
          nav_translations:
            Start: Home
            MCP-server: MCP Server
            Programmeren: Programming
            Bijdragen aan docs: Contribute to docs
        - locale: nl
          default: true
          name: Nederlands

extra_css:
  - assets/stylesheets/home-cards.css
  
  - assets/stylesheets/fri3d-diagrams.css

extra_javascript:
  - assets/javascripts/fri3d-diagrams.js
